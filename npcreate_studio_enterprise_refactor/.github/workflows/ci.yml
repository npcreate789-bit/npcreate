name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/ci.yml"

defaults:
  run:
    shell: bash
    working-directory: npcreate_studio_enterprise_refactor

jobs:
  lint-test-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            npcreate_studio_enterprise_refactor/requirements.txt
            npcreate_studio_enterprise_refactor/requirements-dev.txt

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Mypy (backend only, soft mode)
        run: mypy src/npcreate_backend --ignore-missing-imports || true

      - name: Bandit security scan
        run: bandit -r src -ll -c pyproject.toml

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest --cov=src --cov-report=term-missing

      - name: pip-audit (production deps)
        run: pip-audit -r requirements.txt --strict --progress-spinner off

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-test-audit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: npcreate
          POSTGRES_PASSWORD: npcreate_ci
          POSTGRES_DB: npcreate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U npcreate -d npcreate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            npcreate_studio_enterprise_refactor/requirements.txt
            npcreate_studio_enterprise_refactor/requirements-dev.txt

      - name: Install dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Run Postgres integration tests
        env:
          PYTHONPATH: src
          TEST_POSTGRES_URL: postgresql://npcreate:npcreate_ci@localhost:5432/npcreate_test
        run: pytest tests/unit/test_db_adapter.py -m postgres -v

  sbom:
    runs-on: ubuntu-latest
    needs: lint-test-audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cyclonedx-bom
        run: pip install "cyclonedx-bom>=4,<6"

      - name: Generate CycloneDX SBOM
        working-directory: npcreate_studio_enterprise_refactor
        run: |
          cyclonedx-py requirements requirements.txt --output-format json --outfile sbom.json
          ls -la sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: npcreate_studio_enterprise_refactor/sbom.json
          if-no-files-found: error
          retention-days: 90
