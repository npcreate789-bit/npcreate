<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NP Create Admin</title>
  <style>
    :root{--bg:#070b12;--side:#0b1220;--card:#111827;--soft:#172033;--line:#273449;--text:#f9fafb;--muted:#94a3b8;--red:#e11d48;--green:#22c55e;--yellow:#f59e0b;--blue:#38bdf8;}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif} a{color:inherit;text-decoration:none}
    .layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:var(--side);padding:24px 16px;border-right:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:48px;height:48px;border-radius:16px;background:var(--red);display:grid;place-items:center;font-weight:800}.nav a{display:block;padding:12px 14px;border-radius:14px;color:var(--muted);margin:4px 0}.nav a.active,.nav a:hover{background:var(--soft);color:var(--text)}.main{padding:28px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.title h1{margin:0;font-size:28px}.title p{margin:6px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 12px 30px #00000033}.metric{font-size:30px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.green{background:var(--green)}.yellow{background:var(--yellow)}.red{background:var(--red)}.blue{background:var(--blue)} table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted);font-weight:700}.section{margin-top:18px}.btn{border:0;border-radius:12px;background:var(--red);color:white;padding:10px 14px;font-weight:700;cursor:pointer}.btn.secondary{background:var(--soft)}.login{max-width:420px;margin:9vh auto}.input{width:100%;padding:13px 14px;border-radius:12px;background:var(--soft);border:1px solid var(--line);color:var(--text);margin:8px 0 14px}.danger{color:#fda4af}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
{% block body %}
<div class="layout">
  <aside class="side">
    <div class="brand"><div class="logo">NP</div><div><strong>NP Create</strong><br><span class="muted">Admin Dashboard</span></div></div>
    <nav class="nav">
      <a class="{{'active' if page=='dashboard' else ''}}" href="/admin">ภาพรวม</a>
      <a class="{{'active' if page=='licenses' else ''}}" href="/admin/licenses">License</a>
      <a class="{{'active' if page=='payments' else ''}}" href="/admin/payments">Payment</a>
      <a class="{{'active' if page=='devices' else ''}}" href="/admin/devices">Device</a>
      <a class="{{'active' if page=='news' else ''}}" href="/admin/news">ข่าวสาร</a>
      <a class="{{'active' if page=='updates' else ''}}" href="/admin/updates">Updates</a>
      <a class="{{'active' if page=='logs' else ''}}" href="/admin/logs">Logs / Error</a>
      <a class="{{'active' if page=='settings' else ''}}" href="/admin/settings">Settings</a>
      <a class="{{'active' if page=='account' else ''}}" href="/admin/account">บัญชีของฉัน</a>
    </nav>
    <form method="post" action="/admin/logout" style="margin-top:24px"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><button class="btn secondary" type="submit">ออกจากระบบ</button></form>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
</body>
</html>
