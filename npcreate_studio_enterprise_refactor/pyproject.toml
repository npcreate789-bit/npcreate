[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "npcreate-studio"
version = "2.4.0"
description = "NP Create Studio enterprise backend: PostgreSQL, admin dashboard, MFA, payment gateway adapters, jobs, installer scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "NP Create" }]
dependencies = [
  "customtkinter==5.2.2",
  "pillow>=10.4,<12",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "certifi>=2024.7.4",
  "cryptography>=43,<46",
  "qrcode[pil]>=7.4,<8",
  "python-multipart>=0.0.9,<1",

  "jinja2>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "bandit>=1.7,<2",
]
build = [
  "pyinstaller>=6,<7",
]

[project.scripts]
npcreate-studio = "npcreate_studio.__main__:main"
npcreate-backend = "npcreate_backend.__main__:main"
npcreate-verify-tools = "npcreate_studio.scripts.verify_bundled_tools:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npcreate_studio", "src/npcreate_backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "T20"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
